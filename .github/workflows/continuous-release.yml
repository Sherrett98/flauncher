name: Build Sofa APK

on:
  push:
    branches:
      - 'master'
      - 'sofa-home'
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Build and release APK
    env:
      OUTPUT_DIR: 'build/app/outputs/flutter-apk'
      KEY_DIR: '${{ github.workspace }}/.sofa-key'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Signing key: from repo secrets if you add them (KEYSTORE_FILE_BASE64,
      # FLAUNCHER_KEYSTORE_PASSWORD, FLAUNCHER_SIGNING_KEY_ALIAS,
      # FLAUNCHER_SIGNING_KEY_PASSWORD), otherwise one generated on the first
      # build and kept in the Actions cache so later builds can update the app
      # on the TV without uninstalling it. Nothing secret is committed.
      - name: Restore cached signing key
        uses: actions/cache@v4
        with:
          path: .sofa-key
          key: sofa-signing-key-v1

      - name: Prepare signing key
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.FLAUNCHER_KEYSTORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.FLAUNCHER_SIGNING_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.FLAUNCHER_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE_BASE64" ]; then
            echo -n "$KEYSTORE_FILE_BASE64" | base64 -d > android/app/upload-keystore.jks
            echo "FLAUNCHER_KEYSTORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FLAUNCHER_SIGNING_KEY_ALIAS=$SECRET_ALIAS" >> "$GITHUB_ENV"
            echo "FLAUNCHER_SIGNING_KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "$KEY_DIR"
          if [ ! -f "$KEY_DIR/sofa.jks" ]; then
            PASS=$(openssl rand -hex 24)
            keytool -genkeypair -keystore "$KEY_DIR/sofa.jks" -storetype JKS -alias sofa \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Sofa launcher, C=GB"
            echo -n "$PASS" > "$KEY_DIR/pass"
          fi
          PASS=$(cat "$KEY_DIR/pass")
          echo "::add-mask::$PASS"
          cp "$KEY_DIR/sofa.jks" android/app/upload-keystore.jks
          echo "FLAUNCHER_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "FLAUNCHER_SIGNING_KEY_ALIAS=sofa" >> "$GITHUB_ENV"
          echo "FLAUNCHER_SIGNING_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build
        run: |
          flutter --no-color build apk --release --build-number ${{ github.run_number }} --build-name=1.0.${{ github.run_number }}
          mv $OUTPUT_DIR/app-release.apk $OUTPUT_DIR/sofa.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sofa-apk
          path: ${{ env.OUTPUT_DIR }}/sofa.apk
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "sofa-${{ github.run_number }}" --latest \
            --target "${{ github.sha }}" \
            --title "Sofa build ${{ github.run_number }}" \
            --notes "Built from ${{ github.ref_name }} at ${{ github.sha }}" \
            "$OUTPUT_DIR/sofa.apk"
